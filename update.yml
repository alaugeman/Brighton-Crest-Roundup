name: Update BRC charts

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC (GitHub may run it a few minutes late)
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      STATION_ID: BRC
      STATION_NAME: Brighton Crest
      LOCAL_TZ: America/Denver
      # NWS asks API users to identify themselves; put your email here.
      CONTACT: "brc-weather-charts (alex.laugeman@gmail.com)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new observations
        run: python scripts/fetch.py

      - name: Build charts
        run: python scripts/plot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Update ${STATION_ID} obs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
